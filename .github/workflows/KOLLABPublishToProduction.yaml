name: ' KOLLAB Publish to Production'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * 4'

permissions:
  actions: write
  contents: read

jobs:
  DispatchPublishToProduction:
    runs-on: windows-latest
    steps:
      - name: Dispatch Publish to Environment (Production)
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'PublishToEnvironment.yaml',
              ref: context.ref.replace('refs/heads/', ''),
              inputs: {
                appVersion: 'current',
                environmentName: 'Production',
                createEnvIfNotExists: 'false'
              }
            });
